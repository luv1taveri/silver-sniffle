<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<h1>CSS Flexbox Justify-Content</h1>

<div class="grid">
    <div>
        <h2>flex-start</h2>
        <div class="container start">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>

    <div>
        <h2>space-around</h2>
        <div class="container around">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>

    <div>
        <h2>flex-end</h2>
        <div class="container end">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>

    <div>
        <h2>space-between</h2>
        <div class="container between">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>

    <div>
        <h2>center</h2>
        <div class="container center">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>

    <div>
        <h2>space-evenly</h2>
        <div class="container evenly">
            <div class="yellow"></div>
            <div class="purple"></div>
            <div class="green"></div>
        </div>
    </div>
</div>

</body>
</html>
